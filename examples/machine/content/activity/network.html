<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Network</title>
  <meta name="lcars:size" content="wide">
  <meta name="lcars:order" content="20">
  <meta name="lcars:accent" content="lilac">
  <style>
    p, h2, ul, dl, dd { margin: 0; }
    .panel { display: grid; gap: 1.5rem; }
    h2 { font: 500 1.375rem/1.2 var(--lcars-label-font, sans-serif); }
    .label { font: 500 1.125rem/1.3 var(--lcars-label-font, sans-serif); color: var(--lcars-muted, #b8adb7); }
    .value { font: 500 2rem/1.15 var(--lcars-label-font, sans-serif); color: var(--lcars-blue, #9999ff); font-variant-numeric: tabular-nums; }
    .muted { color: var(--lcars-muted, #b8adb7); }
    .warning { color: var(--lcars-orange, #ff9900); font-weight: 600; }
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
    .grid { stroke: #2e2833; stroke-width: 1; }
    .axis { stroke: #5a5060; stroke-width: 1; }
    .tick { fill: var(--lcars-muted, #b8adb7); font: 13px var(--lcars-label-font, sans-serif); }
    .end { fill: var(--lcars-text, #f5eee6); font: 14px var(--lcars-label-font, sans-serif); }
    .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .line.s0 { stroke: var(--lcars-blue, #9999ff); }
    .line.s1 { stroke: var(--lcars-peach, #ff9966); }
    .dot { stroke: #000; stroke-width: 2; }
    .dot.s0 { fill: var(--lcars-blue, #9999ff); }
    .dot.s1 { fill: var(--lcars-peach, #ff9966); }
    .cross { stroke: var(--lcars-muted, #b8adb7); stroke-width: 1; }
    .tip[hidden] { display: none; }
    .tip { position: absolute; top: 0; display: grid; gap: .125rem; padding: .5rem .75rem; background: #1a171d; border-left: 4px solid var(--lcars-lilac, #cc99cc); pointer-events: none; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; list-style: none; padding: 0; margin: 0; }
    .legend li { display: flex; align-items: center; gap: .5rem; }
    .legend svg { width: 2rem; height: .75rem; }
    details { border-top: 2px solid var(--lcars-lilac, #cc99cc); padding-top: .25rem; }
    summary { cursor: pointer; min-height: 44px; padding: .5rem 0; }
    .scroll { overflow-x: auto; max-height: 18rem; overflow-y: auto; }
    .scroll:focus-visible { outline: 2px solid var(--lcars-apricot, #ffcc99); }
    table { border-collapse: collapse; font-variant-numeric: tabular-nums; width: 100%; }
    caption { text-align: left; color: var(--lcars-muted, #b8adb7); padding-bottom: .5rem; }
    th, td { text-align: right; padding: .25rem .75rem; border-bottom: 1px solid #2e2833; }
    th:first-child { text-align: left; }
    .ifaces { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 13rem), 1fr)); }
    .iface { display: grid; gap: .125rem; border-left: 6px solid var(--lcars-lilac, #cc99cc); padding-left: .75rem; font-variant-numeric: tabular-nums; }
    .iface[data-down] { border-left-color: #3a3340; }
    .iface .name { font: 500 1.5rem/1.2 var(--lcars-label-font, sans-serif); }
    .latency { display: flex; flex-wrap: wrap; gap: .5rem 2rem; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <section class="panel" aria-label="Network interfaces and traffic">
    <div class="ifaces" id="ifaces"><p>Unavailable</p></div>
    <div><h2>Round-trip latency</h2><p class="latency" id="latency"></p></div>
    <div>
      <h2>enp7s0 hourly average Mb/s, last 24 hours</h2>
      <p class="muted">The 11:00 spike is container image pulls; 04:00 is the offsite snapshot push.</p>
    </div>
    <ul class="legend" aria-label="Legend">
        <li><svg viewBox="0 0 32 12" aria-hidden="true"><line x1="2" y1="6" x2="30" y2="6" class="line s0"/></svg>Received</li>
        <li><svg viewBox="0 0 32 12" aria-hidden="true"><line x1="2" y1="6" x2="30" y2="6" class="line s1" stroke-dasharray="6 4"/></svg>Sent</li>
      </ul>
    <div class="chart" id="chart"></div>
    <details><summary>Traffic data table</summary><div class="scroll" id="table" tabindex="0" role="region" aria-label="Hourly network traffic"></div></details>
  </section>
  <script>
    // Small responsive line chart: one y-axis, legend, direct end labels,
    // crosshair tooltip, and redraw on width change.
    const SVG = 'http://www.w3.org/2000/svg';
    const node = (tag, attrs, parent) => { const n = document.createElementNS(SVG, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); parent?.append(n); return n; };
    function lineChart(host, cfg) {
      let current = null;
      const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true;
      const draw = () => {
        if (!current) return;
        const {labels, series, max, ticks, tick, unit, description} = current;
        const W = Math.max(240, Math.floor(host.clientWidth)), H = 220;
        const direct = W >= 420;
        const m = {t: 12, r: direct ? 72 : 12, b: 30, l: 52};
        const iw = W - m.l - m.r, ih = H - m.t - m.b, n = labels.length;
        const x = i => m.l + i * iw / (n - 1), y = v => m.t + ih - Math.min(v, max) / max * ih;
        const svg = node('svg', {viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': description});
        for (const t of ticks) {
          node('line', {x1: m.l, x2: m.l + iw, y1: y(t), y2: y(t), class: t ? 'grid' : 'axis'}, svg);
          node('text', {x: m.l - 8, y: y(t), 'text-anchor': 'end', 'dominant-baseline': 'middle', class: 'tick'}, svg).textContent = tick(t);
        }
        const every = Math.ceil(n / Math.max(2, Math.floor(iw / 64)));
        labels.forEach((l, i) => { if (i % every === 0) node('text', {x: x(i), y: H - 8, 'text-anchor': 'middle', class: 'tick'}, svg).textContent = l; });
        const ends = [];
        series.forEach((s, k) => {
          node('path', {d: s.values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(''), class: `line s${k}`, 'stroke-dasharray': s.dash ?? ''}, svg);
          ends.push({k, y: y(s.values.at(-1)), text: s.short});
        });
        if (direct) {
          ends.sort((a, b) => a.y - b.y);
          for (let i = 1; i < ends.length; i++) ends[i].y = Math.max(ends[i].y, ends[i - 1].y + 18);
          for (const e of ends) node('text', {x: m.l + iw + 8, y: e.y, 'dominant-baseline': 'middle', class: 'end'}, svg).textContent = e.text;
        }
        const cross = node('line', {y1: m.t, y2: m.t + ih, class: 'cross', visibility: 'hidden'}, svg);
        const dots = series.map((s, k) => node('circle', {r: 5, class: `dot s${k}`, visibility: 'hidden'}, svg));
        const hit = node('rect', {x: m.l - 12, y: 0, width: iw + 24, height: H, fill: 'transparent'}, svg);
        const hide = () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); dots.forEach(d => d.setAttribute('visibility', 'hidden')); };
        hit.addEventListener('pointermove', e => {
          const r = svg.getBoundingClientRect();
          const i = Math.max(0, Math.min(n - 1, Math.round(((e.clientX - r.left) * W / r.width - m.l) / iw * (n - 1))));
          cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
          series.forEach((s, k) => { dots[k].setAttribute('cx', x(i)); dots[k].setAttribute('cy', y(s.values[i])); dots[k].setAttribute('visibility', 'visible'); });
          tip.replaceChildren();
          const head = document.createElement('strong'); head.textContent = labels[i]; tip.append(head);
          for (const s of series) { const line = document.createElement('span'); line.textContent = `${s.name}: ${s.values[i]} ${unit}`; tip.append(line); }
          tip.hidden = false;
          const left = x(i) / W * r.width;
          tip.style.left = `${Math.min(Math.max(0, left - tip.offsetWidth / 2), r.width - tip.offsetWidth)}px`;
        });
        hit.addEventListener('pointerleave', hide);
        host.replaceChildren(svg, tip);
      };
      let lastWidth = 0;
      new ResizeObserver(() => { const w = Math.floor(host.clientWidth); if (w !== lastWidth) { lastWidth = w; draw(); } }).observe(host);
      return next => { current = next; draw(); };
    }
    function dataTable(container, labels, series, unit) {
      const table = document.createElement('table');
      const cap = document.createElement('caption'); cap.textContent = `Values in ${unit}`; table.append(cap);
      const head = table.createTHead().insertRow();
      for (const h of ['Time', ...series.map(s => s.name)]) { const th = document.createElement('th'); th.scope = 'col'; th.textContent = h; head.append(th); }
      const body = table.createTBody();
      labels.forEach((l, i) => { const r = body.insertRow(); const th = document.createElement('th'); th.scope = 'row'; th.textContent = l; r.append(th); for (const s of series) r.insertCell().textContent = s.values[i]; });
      container.replaceChildren(table);
    }
    const series = [{"name":"Received","short":"In"},{"name":"Sent","short":"Out","dash":"6 4"}];
    const render = lineChart(document.getElementById('chart'));
    const fmt = v => new Intl.NumberFormat(undefined, {maximumFractionDigits: 1}).format(v);
    LCARS.onData(({data: d, missing}) => {
      if (missing || !d) { document.getElementById('ifaces').textContent = 'Unavailable'; return; }
      document.getElementById('ifaces').replaceChildren(...d.interfaces.map(i => {
        const div = document.createElement('div'); div.className = 'iface'; if (i.state !== 'Up') div.dataset.down = '';
        const lines = [['name', i.name], ['', `${i.kind} · ${i.state}${i.speed !== '—' ? ' · ' + i.speed : ''}`], ['muted', i.address],
          ['', i.state === 'Up' ? `${fmt(i.rxGiB)} GiB in · ${fmt(i.txGiB)} GiB out since boot` : 'No traffic since boot']];
        for (const [cls, text] of lines) { const p = document.createElement('p'); if (cls) p.className = cls; p.textContent = text; div.append(p); }
        return div;
      }));
      document.getElementById('latency').replaceChildren(...d.latency.map(l => { const s = document.createElement('span'); s.textContent = `${l.target}: ${l.ms} ms`; return s; }));
      const s = [{...series[0], values: d.series.rx}, {...series[1], values: d.series.tx}];
      render({labels: d.labels, series: s, max: 400, ticks: [0, 100, 200, 300, 400], tick: t => `${t}`, unit: 'Mb/s',
        description: `Line chart of received and sent traffic in megabits per second over 24 hours. Received peaks at ${Math.max(...d.series.rx)} Mb/s at 11:00; sent peaks at ${Math.max(...d.series.tx)} Mb/s at 04:00.`});
      dataTable(document.getElementById('table'), d.labels, s, 'Mb/s');
    });
  </script>
</body>
</html>
