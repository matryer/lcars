<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Drive health</title>
  <meta name="lcars:size" content="wide">
  <meta name="lcars:order" content="20">
  <meta name="lcars:accent" content="lilac">
  <style>
    p, h2, dl, dd { margin: 0; }
    .drives { display: grid; gap: 1.5rem; }
    .drive { display: grid; gap: .75rem; }
    .drive + .drive { border-top: 2px solid #25212b; padding-top: 1.5rem; }
    h2 { font: 500 1.5rem/1.2 var(--lcars-label-font, sans-serif); }
    .sub { color: var(--lcars-muted, #b8adb7); }
    .state { font-weight: 600; color: var(--lcars-text, #f5eee6); }
    .state.Warning { color: var(--lcars-orange, #ff9900); }
    dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 8rem), 1fr)); gap: .75rem 1rem; }
    dt { font: 500 1rem/1.3 var(--lcars-label-font, sans-serif); color: var(--lcars-muted, #b8adb7); }
    dd { font: 500 1.5rem/1.2 var(--lcars-label-font, sans-serif); color: var(--lcars-blue, #9999ff); font-variant-numeric: tabular-nums; }
    .foot { color: var(--lcars-muted, #b8adb7); }
  </style>
</head>
<body>
  <section class="drives" aria-label="SMART health per drive">
    <div class="drives" id="drives"><p>Unavailable</p></div>
    <p class="foot">From <code>smartctl -a</code>. Illustrative fixture: the archive drive is healthy, it is only full.</p>
  </section>
  <script>
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
    LCARS.onData(({data: d, missing}) => {
      const root = document.getElementById('drives');
      if (missing || !Array.isArray(d?.drives)) { root.replaceChildren(el('p', '', 'Unavailable')); return; }
      root.replaceChildren(...d.drives.map(drive => {
        const article = el('article', 'drive');
        const head = el('div');
        const sub = el('p', 'sub', `${drive.device} · ${drive.role} · `);
        sub.append(el('span', `state ${drive.state}`, drive.state));
        head.append(el('h2', '', drive.model), sub);
        const dl = el('dl');
        for (const [label, value] of drive.attributes) { const div = el('div'); div.append(el('dt', '', label), el('dd', '', value)); dl.append(div); }
        article.append(head, dl);
        return article;
      }));
    });
  </script>
</body>
</html>
