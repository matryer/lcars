<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Processor</title>
  <meta name="lcars:size" content="wide">
  <meta name="lcars:order" content="10">
  <meta name="lcars:accent" content="orange">
  <style>
    p, h2 { margin: 0; }
    .cpu { display: grid; gap: 1.5rem; }
    .summary { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 8.5rem), 1fr)); }
    .label { font: 500 1.125rem/1.3 var(--lcars-label-font, sans-serif); color: var(--lcars-muted, #b8adb7); }
    .value { font: 500 2rem/1.15 var(--lcars-label-font, sans-serif); color: var(--lcars-blue, #9999ff); font-variant-numeric: tabular-nums; }
    h2 { font: 500 1.5rem/1.2 var(--lcars-label-font, sans-serif); }
    .threads { display: grid; gap: .5rem; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    @media (min-width: 400px) { .threads { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
    @media (min-width: 900px) { .threads { grid-template-columns: repeat(16, minmax(0, 1fr)); } }
    .thread { display: grid; gap: .25rem; justify-items: stretch; text-align: center; font-variant-numeric: tabular-nums; }
    .meter { height: 4.5rem; background: #25212b; border-radius: .25rem .25rem 0 0; display: flex; align-items: flex-end; overflow: hidden; }
    .meter span { display: block; width: 100%; background: var(--lcars-blue, #9999ff); border-radius: .25rem .25rem 0 0; }
    .thread[data-hot] .meter span { background: var(--lcars-peach, #ff9966); }
    .thread small { color: var(--lcars-muted, #b8adb7); font-size: .875rem; }
    .key { color: var(--lcars-muted, #b8adb7); }
  </style>
</head>
<body>
  <section class="cpu" aria-label="Processor utilisation">
    <div class="summary" id="summary"></div>
    <div>
      <h2 id="model">Processor</h2>
      <p class="key">Utilisation per hardware thread. Threads above 60% are marked “hot” and drawn in peach.</p>
    </div>
    <div class="threads" id="threads" role="list" aria-label="Per-thread utilisation"></div>
  </section>
  <script>
    const fmt = (v, d = 0) => new Intl.NumberFormat(undefined, {maximumFractionDigits: d, minimumFractionDigits: d}).format(v);
    const p = (cls, text) => { const e = document.createElement('p'); e.className = cls; e.textContent = text; return e; };
    LCARS.onData(({data: d, missing}) => {
      const summary = document.getElementById('summary');
      const threads = document.getElementById('threads');
      if (missing || !d || !Array.isArray(d.threads)) {
        summary.replaceChildren(p('value', 'Unavailable'));
        threads.replaceChildren();
        return;
      }
      const avg = d.threads.reduce((a, b) => a + b, 0) / d.threads.length;
      document.getElementById('model').textContent = `${d.model} · ${d.cores} cores, ${d.threads.length} threads`;
      summary.replaceChildren(...[
        ['Average busy', `${fmt(avg)}%`],
        ['Load, 1 min', fmt(d.load[0], 2)],
        ['Load, 15 min', fmt(d.load[2], 2)],
        ['Clock', `${fmt(d.averageGHz, 2)} GHz`],
        ['Package power', `${d.packageWatts} W`]
      ].map(([label, value]) => { const div = document.createElement('div'); div.append(p('label', label), p('value', value)); return div; }));
      threads.replaceChildren(...d.threads.map((v, i) => {
        const t = document.createElement('div');
        t.className = 'thread'; t.setAttribute('role', 'listitem');
        if (v > 60) t.dataset.hot = '';
        t.setAttribute('aria-label', `Thread ${i}: ${v}%${v > 60 ? ', hot' : ''}`);
        const meter = document.createElement('div'); meter.className = 'meter';
        const bar = document.createElement('span'); bar.style.height = `${Math.max(2, v)}%`;
        meter.append(bar);
        const val = document.createElement('strong'); val.textContent = `${v}%`;
        const name = document.createElement('small'); name.textContent = `T${i}`;
        t.append(meter, val, name);
        return t;
      }));
    });
  </script>
</body>
</html>
