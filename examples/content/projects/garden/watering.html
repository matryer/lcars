<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Watering</title>
  <meta name="lcars:size" content="wide">
  <meta name="lcars:order" content="10">
  <meta name="lcars:accent" content="blue">
  <style>
    .beds { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 10rem), 1fr)); gap: 1rem; }
    .bed { border-left: 4px solid var(--lcars-blue); padding: .25rem 0 .25rem .75rem; display: grid; gap: .25rem; }
    .bed.dry { border-left-color: var(--lcars-orange); }
    .bed p { margin: 0; }
    .name { font: 500 1.125rem/1.2 var(--lcars-label-font); text-transform: uppercase; letter-spacing: .04em; color: var(--lcars-blue); }
    .dry .name { color: var(--lcars-orange); }
    .moisture { font: 500 2.25rem/1.1 var(--lcars-label-font); }
    .meta { color: var(--lcars-muted); font-size: .875rem; }
  </style>
</head>
<body>
  <div class="beds" id="beds" role="list"></div>
  <script>
    let clock = new Date().toISOString();
    LCARS.onState(state => { clock = state.clock; });
    LCARS.onData(({data, missing}) => {
      const beds = !missing && Array.isArray(data?.beds) ? data.beds : [];
      document.getElementById('beds').replaceChildren(...beds.map(bed => {
        const dry = bed.moisture < 30;
        const card = document.createElement('div'); card.className = 'bed' + (dry ? ' dry' : ''); card.setAttribute('role', 'listitem');
        card.innerHTML = '<p class="name"></p><p class="moisture"></p><p class="meta state"></p><p class="meta">Next watering <lcars-time label="Next watering"></lcars-time></p>';
        card.querySelector('.name').textContent = bed.name;
        card.querySelector('.moisture').textContent = `${bed.moisture}%`;
        card.querySelector('.state').textContent = dry ? 'Warning · dry soil' : 'Normal · soil moisture';
        // Demo fixture: offsets keep the example fresh. Real producers should write RFC3339 times.
        card.querySelector('lcars-time').setAttribute('datetime', new Date(Date.parse(clock) + bed.nextWateringMinutes * 60000).toISOString());
        return card;
      }));
    });
  </script>
</body>
</html>
