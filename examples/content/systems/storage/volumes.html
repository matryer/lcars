<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Volumes</title>
  <meta name="lcars:size" content="wide">
  <meta name="lcars:order" content="10">
  <meta name="lcars:accent" content="orange">
  <style>
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.25rem; }
    li + li { margin-top: 0; }
    li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .25rem 1rem; align-items: baseline; }
    .name { font: 500 1.25rem/1.2 var(--lcars-label-font); letter-spacing: .03em; }
    .used { font: 500 1.5rem/1 var(--lcars-label-font); }
    .bar { grid-column: 1 / -1; height: .75rem; background: #25212b; border-radius: 0 .375rem .375rem 0; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--lcars-blue); border-radius: inherit; }
    .high .bar span { background: var(--lcars-orange); } .high .state { color: var(--lcars-orange); }
    .meta { grid-column: 1 / -1; color: var(--lcars-muted); font-size: .875rem; }
  </style>
</head>
<body>
  <ul id="volumes"></ul>
  <script>
    let clock = new Date().toISOString();
    LCARS.onState(state => { clock = state.clock; });
    LCARS.onData(({data, missing}) => {
      const volumes = !missing && Array.isArray(data?.volumes) ? data.volumes : [];
      document.getElementById('volumes').replaceChildren(...volumes.map(volume => {
        const percent = Math.round(volume.usedTB / volume.sizeTB * 100);
        const li = document.createElement('li'); li.className = percent >= 80 ? 'high' : '';
        li.innerHTML = '<span class="name"></span><span class="used"></span><span class="bar" aria-hidden="true"><span></span></span><span class="meta"><span class="state"></span> · <span class="space"></span> · last scrub <lcars-time label="Last scrub"></lcars-time></span>';
        li.querySelector('.name').textContent = `${volume.host} · ${volume.name}`;
        li.querySelector('.used').textContent = `${percent}%`;
        li.querySelector('.bar span').style.width = `${percent}%`;
        li.querySelector('.state').textContent = percent >= 80 ? 'Warning' : 'Normal';
        li.querySelector('.space').textContent = `${volume.usedTB} of ${volume.sizeTB} TB`;
        // Demo fixture: ages keep the example fresh. Real producers should write RFC3339 times.
        li.querySelector('lcars-time').setAttribute('datetime', new Date(Date.parse(clock) - volume.scrubDaysAgo * 86400000).toISOString());
        return li;
      }));
    });
  </script>
</body>
</html>
