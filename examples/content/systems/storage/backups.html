<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Backups</title>
  <meta name="lcars:order" content="20">
  <meta name="lcars:accent" content="orange">
  <style>
    .summary { font: 500 2rem/1.1 var(--lcars-label-font); margin: 0 0 1rem; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
    li + li { margin-top: 0; }
    li { border-left: 4px solid var(--lcars-blue); }
    li > button { display: block; width: 100%; min-height: 44px; padding: .125rem .5rem .125rem .75rem; border: 0; background: none; color: var(--lcars-text); font: inherit; text-align: left; cursor: pointer; }
    li > button:hover { background: #1c1820; }
    li > button > span { display: block; }
    li.warning { border-left-color: var(--lcars-orange); }
    li.critical { border-left-color: var(--lcars-critical); }
    p, li span { margin: 0; }
    .job { font: 500 1.125rem/1.3 var(--lcars-label-font); letter-spacing: .03em; }
    .state { font: 500 .9375rem/1.3 var(--lcars-label-font); text-transform: uppercase; letter-spacing: .04em; }
    .warning .state { color: var(--lcars-orange); } .critical .state { color: var(--lcars-critical); }
    .detail, .when { color: var(--lcars-muted); font-size: .875rem; }
    .when { padding: 0 .5rem .125rem .75rem; }
  </style>
</head>
<body>
  <p class="summary" id="summary">Unavailable</p>
  <ul id="jobs"></ul>
  <script>
    let clock = new Date().toISOString();
    LCARS.onState(state => { clock = state.clock; });
    LCARS.onData(({data, missing}) => {
      const jobs = !missing && Array.isArray(data?.jobs) ? data.jobs : [];
      const normal = jobs.filter(job => job.state === 'Normal').length;
      document.getElementById('summary').textContent = jobs.length ? `${normal} of ${jobs.length} normal` : 'Unavailable';
      document.getElementById('jobs').replaceChildren(...jobs.map(job => {
        const li = document.createElement('li'); li.className = job.state.toLowerCase();
        // The time stays outside the button: <lcars-time> is its own control.
        li.innerHTML = '<button type="button"><span class="job"></span><span class="state"></span><span class="detail"></span></button><p class="when">Last success <lcars-time label="Last success"></lcars-time></p>';
        li.querySelector('button').id = `job-${job.name}`.replace(/[^\w-]/g, '-');
        li.querySelector('.job').textContent = job.name;
        li.querySelector('.state').textContent = job.state;
        li.querySelector('.detail').textContent = job.detail;
        // Demo fixture: ages keep the example fresh. Real producers should write RFC3339 times.
        const success = Number.isFinite(job.lastSuccessMinutesAgo) ? new Date(Date.parse(clock) - job.lastSuccessMinutesAgo * 60000).toISOString() : '';
        li.querySelector('lcars-time').setAttribute('datetime', success);
        li.querySelector('button').addEventListener('click', () => {
          const fields = [{label: 'State', value: job.state}, success ? {label: 'Last success', time: success} : {label: 'Last success', value: 'Unknown'}];
          LCARS.openDetail({title: job.name, body: job.detail || '', fields});
        });
        return li;
      }));
      if (!jobs.length) document.getElementById('jobs').textContent = 'Unavailable';
    });
  </script>
</body>
</html>
