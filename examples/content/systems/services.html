<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Services</title>
  <meta name="lcars:order" content="30">
  <meta name="lcars:accent" content="lilac">
  <style>
    .summary { font: 500 2rem/1.1 var(--lcars-label-font); margin: 0 0 .75rem; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { border-bottom: 1px solid #3a3440; }
    li > button { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .25rem 1rem; width: 100%; min-height: 44px; padding: .375rem .25rem .375rem 0; border: 0; background: none; color: var(--lcars-text); font: inherit; text-align: left; cursor: pointer; }
    li > button:hover { background: #1c1820; }
    li + li { margin-top: 0; }
    .host { color: var(--lcars-muted); font-size: .875rem; }
    .warning { color: var(--lcars-orange); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 .5rem; }
    .chips button { padding: 0 16px; border-radius: 0 22px 22px 0; background: #2a2630; color: var(--lcars-text); font: 500 .9375rem/1 var(--lcars-label-font); text-transform: uppercase; letter-spacing: .04em; }
    .chips button[aria-pressed=true] { background: var(--lcars-lilac); color: var(--lcars-ink); }

  </style>
</head>
<body>
  <p class="summary" id="summary">Unavailable</p>
  <div class="chips"><button type="button" id="issues" aria-pressed="false">Issues only</button></div>
  <ul id="services"></ul>
  <script>
    let services = [], issuesOnly = false;
    document.getElementById('issues').addEventListener('click', event => { issuesOnly = !issuesOnly; event.currentTarget.setAttribute('aria-pressed', String(issuesOnly)); render(); });
    LCARS.onData(({data, missing}) => { services = !missing && Array.isArray(data?.services) ? data.services : []; render(); });
    function render() {
      const normal = services.filter(s => s.state === 'Normal').length;
      document.getElementById('summary').textContent = services.length ? `${normal} of ${services.length} normal` : 'Unavailable';
      document.getElementById('services').replaceChildren(...services.filter(service => !issuesOnly || service.state !== 'Normal').sort((a, b) => (a.state === 'Normal') - (b.state === 'Normal')).map(service => {
        const li = document.createElement('li');
        const button = document.createElement('button'); button.type = 'button'; button.id = `service-${service.name}`.replace(/[^\w-]/g, '-');
        const name = document.createElement('span'); name.textContent = service.name;
        const status = document.createElement('span');
        if (service.state === 'Normal') { status.className = 'host'; status.textContent = service.host; }
        else { status.className = 'warning'; status.textContent = `${service.state} · ${service.note}`; }
        button.append(name, status); li.append(button);
        button.addEventListener('click', () => {
          const neighbours = services.filter(other => other !== service && other.host === service.host).map(other => other.name);
          const fields = [{label: 'State', value: service.state}, {label: 'Host', value: service.host}];
          if (service.note) fields.push({label: 'Note', value: service.note});
          if (neighbours.length) fields.push({label: `Also on ${service.host}`, value: neighbours.join(', ')});
          LCARS.openDetail({title: service.name, body: service.state === 'Normal' ? 'Running normally.' : `${service.state}: ${service.note || 'see the host for details'}.`, fields});
        });
        return li;
      }));
    }
  </script>
</body>
</html>
