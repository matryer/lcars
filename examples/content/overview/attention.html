<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Needs attention</title>
  <meta name="lcars:order" content="40">
  <meta name="lcars:accent" content="orange">
  <style>
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
    li + li { margin-top: 0; }
    li > button { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .125rem .75rem; align-items: baseline; width: 100%; min-height: 44px; padding: .25rem .5rem .25rem 0; border: 0; background: none; color: var(--lcars-text); font: inherit; text-align: left; cursor: pointer; border-radius: 0 1.5rem 1.5rem 0; }
    li > button:hover { background: #1c1820; }
    .go { grid-column: 2; color: var(--lcars-muted); font-size: .875rem; }
    li > button:hover .go { color: var(--lcars-orange); }
    .state { font: 500 1rem/1 var(--lcars-label-font); text-transform: uppercase; letter-spacing: .04em; padding: .35rem .6rem; min-width: 5.5rem; text-align: center; color: var(--lcars-ink); background: var(--lcars-apricot); border-radius: 0 .75rem .75rem 0; }
    .state.critical { background: var(--lcars-critical); }
    .clear { margin: 0; color: var(--lcars-muted); }
  </style>
</head>
<body>
  <ul id="items"></ul>
  <p class="clear" id="clear" hidden>Normal · nothing needs attention.</p>
  <script>
    const rank = {Critical: 0, Warning: 1};
    LCARS.onData(({data, missing}) => {
      const items = !missing && Array.isArray(data?.items) ? [...data.items].sort((a, b) => (rank[a.state] ?? 2) - (rank[b.state] ?? 2)) : [];
      const list = document.getElementById('items');
      list.replaceChildren(...items.map(item => {
        const li = document.createElement('li');
        const button = document.createElement('button'); button.type = 'button';
        const state = document.createElement('span'); state.className = 'state' + (item.state === 'Critical' ? ' critical' : ''); state.textContent = item.state;
        const text = document.createElement('span'); text.textContent = item.title;
        const where = document.createElement('span'); where.className = 'go'; where.textContent = `Open ${item.where} →`;
        button.append(state, text, where);
        // Opens the page that owns this item. The host only allows it from a click or key press.
        if (item.section) button.addEventListener('click', () => LCARS.navigate(item.section));
        else button.disabled = true;
        li.append(button);
        return li;
      }));
      const clear = document.getElementById('clear');
      clear.hidden = items.length > 0;
      clear.textContent = missing ? 'Unavailable' : 'Normal · nothing needs attention.';
    });
  </script>
</body>
</html>
