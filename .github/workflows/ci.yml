name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  go:
    name: Go tests and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Browser tests look for chromium; GitHub's Ubuntu runner ships Chrome.
      - name: Make Chrome available to browser tests
        run: |
          chrome_path="$(command -v google-chrome)"
          "$chrome_path" --version
          sudo ln -sf "$chrome_path" /usr/local/bin/chromium
      - run: go test -race ./...
      - run: go vet ./...

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      # Ubuntu 24.04's AppArmor restriction otherwise prevents Chrome startup.
      # Keep Chrome's sandbox enabled; allow its user namespaces in this CI VM.
      - name: Enable Chrome sandbox namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Select Chrome for release browser tests
        if: runner.os == 'Linux'
        run: |
          chrome_path="$(command -v google-chrome)"
          "$chrome_path" --version
          sudo ln -sf "$chrome_path" /usr/local/bin/chromium
      - name: Install Linux webview development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o lcars-desktop .
      - name: Package native CLI and desktop release
        working-directory: .
        shell: bash
        run: |
          target="$(go env GOOS)/$(go env GOARCH)"
          go run ./tools/release --bump none --targets "$target" --desktop-targets "$target"
