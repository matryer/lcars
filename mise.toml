[tools]
go = "1.27.3"
node = "24"

[tasks.build]
description = "Build the LCARS binary"
run = "go build -o lcars ./cmd/lcars"

[tasks.fmt]
description = "Format all Go and web source, examples and documentation"
run = ["npm ci --ignore-scripts", "gofmt -w cmd desktop internal skills tools web", "npm run fmt"]

[tasks.test]
description = "Run JavaScript tests, Go race tests and vet"
run = ["npm ci --ignore-scripts", "npm test", "go test -race ./...", "go vet ./..."]

[tasks.bump]
description = "Bump patch by default; --bump minor or major selects another increment"
run = "go run ./tools/release --version-only"

[tasks.release]
description = "Bump patch, check and package CLI plus native desktop; --desktop-targets none skips desktop"
run = "go run ./tools/release"

[tasks.desktop]
description = "Build the Wails desktop app (requires native platform libraries)"
dir = "desktop"
run = "go build -o lcars-desktop ."

[tasks."desktop:run"]
description = "Open the Wails desktop app with the example canvas"
dir = "desktop"
run = "go run . --data ../examples/content"

[tasks."desktop:test"]
description = "Test and vet the desktop app (requires native platform libraries)"
dir = "desktop"
run = ["go test -race ./...", "go vet ./..."]
